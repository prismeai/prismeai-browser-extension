name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Syntax-check the extension scripts (no deps, no build step).
      - run: npm run check
      # Build the store zip and expose it as a downloadable CI artifact.
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: prismeai-extension-zip
          path: dist/*.zip
          if-no-files-found: error
